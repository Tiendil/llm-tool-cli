[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-tool-cli"
version = "0.1.0"
description = "Shared foundations for LLM-oriented Python command-line tools."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12,<4.0"
license = "BSD-3-Clause"
authors = [
    { name = "Aliaksei Yaletski", email = "a.eletsky@gmail.com" },
]
keywords = ["ai-agents", "cli", "llm", "developer-tools"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.12,<3",
    "tomli>=2.4.1,<3",
]

[project.urls]
Homepage = "https://github.com/Tiendil/llm-tool-cli"
Repository = "https://github.com/Tiendil/llm-tool-cli"
Issues = "https://github.com/Tiendil/llm-tool-cli/issues"
Changelog = "https://github.com/Tiendil/llm-tool-cli/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "ast-grep-cli==0.44.*",
    "autoflake==2.3.*",
    "black==25.12.*",
    "changy==0.4.*",
    "codespell==2.4.*",
    "depmesh==0.1.2",
    "flake8==7.3.*",
    "flake8-absolute-import==1.0.*",
    "flake8-annotations-complexity==0.1.*",
    "flake8-bandit==4.1.*",
    "flake8-cognitive-complexity==0.1.*",
    "flake8-docstrings==1.7.*",
    "flake8-eradicate==1.5.*",
    "flake8-functions==0.0.*",
    "flake8-print==5.0.*",
    "flake8-pyproject==1.2.*",
    "flake8-pytest==1.4.*",
    "isort==7.0.*",
    "mypy==1.19.*",
    "pytest==9.0.*",
    "pytest-mock==3.15.*",
    "tach==0.34.*",
]

[tool.isort]
profile = "black"
line_length = 119

[tool.black]
line-length = 119

[tool.flake8]
ignore = [
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
    "D200", "D400", "D401", "S101", "S113", "S311", "W503", "CFQ004", "E203",
]
max-line-length = 119
exclude = ["build", "llm_tool_cli.egg-info"]

[tool.autoflake]
in_place = true
remove_all_unused_imports = true
remove_unused_variables = true
recursive = true

[tool.mypy]
plugins = ["pydantic.mypy"]
strict = true
implicit_reexport = true
disallow_any_explicit = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.hatch.build.targets.sdist]
include = [
    "/llm_tool_cli",
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["llm_tool_cli"]
