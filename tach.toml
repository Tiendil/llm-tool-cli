forbid_circular_dependencies = true

exclude = [
    ".git/",
    ".session/",
    ".venv/",
    "build/",
    "dist/",
    "**/__pycache__/",
]

[[modules]]
path = "llm_tool_cli"
depends_on = []
visibility = []

[[modules]]
path = "llm_tool_cli.core"
